<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- الشعار الأيقوني (فرن تقليدي وشعلة وفطيرة ذهبية) -->
  <g transform="translate(10, 10)">
    <!-- الفرن والقبة -->
    <path d="M40 75 C15 75 10 50 20 30 C30 10 50 10 60 30 C70 50 65 75 40 75 Z" fill="#1C1917" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- فتحة الفرن -->
    <path d="M28 75 C28 55 52 55 52 75 Z" fill="#292524" />
    <!-- الشعلة داخل الفرن -->
    <path d="M36 75 C36 65 40 60 40 60 C40 60 44 65 44 75 Z" fill="url(#fireGrad)" />
    <!-- حبة قمح / سنبلة ذهبية -->
    <path d="M40 5 L43 15 L40 25 L37 15 Z" fill="url(#goldGrad)" />
    <circle cx="28" cy="18" r="3" fill="url(#goldGrad)" />
    <circle cx="52" cy="18" r="3" fill="url(#goldGrad)" />
    <!-- نجمة الكويت / الديرة -->
    <polygon points="40,2 42,7 47,8 43,12 44,17 40,14 36,17 37,12 33,8 38,7" fill="#F59E0B" />
  </g>

  <!-- اسم المتجر بالخط العربي الكوفي الحديث -->
  <text x="95" y="52" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="url(#goldGrad)" letter-spacing="0.5">
    فطاير الديرة
  </text>
  
  <!-- السلوجان باللغة الإنجليزية والعربية -->
  <text x="95" y="78" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#A8A29E" letter-spacing="1">
    KUWAITI PIES &amp; PASTRIES • معجنات طازجة من فرن الحجر
  </text>
</svg>
